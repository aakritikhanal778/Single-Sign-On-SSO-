<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central SSO Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e293b,#312e81);
}

.card{
width:380px;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.logo{
width:70px;
height:70px;
margin:auto;
border-radius:16px;
background:#4f46e5;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:22px;
margin-bottom:20px;
}

h1{
text-align:center;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#6b7280;
margin-bottom:30px;
}

input{
width:100%;
padding:14px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #d1d5db;
font-size:15px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#4f46e5;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

#message{
margin-top:15px;
text-align:center;
color:#dc2626;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">SSO</div>

<h1>Central Login</h1>

<p class="subtitle">
Sign in once to access all applications.
</p>

<form id="loginForm">

<input
id="username"
type="text"
placeholder="Username"
required>

<input
id="password"
type="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

<p id="message"></p>

</div>

<script>
const params = new URLSearchParams(window.location.search);

const allowedRedirects = [
  "http://localhost:5173",
  "http://localhost:5174"
];

const requestedRedirect = params.get("redirect");

const redirect = allowedRedirects.includes(requestedRedirect)
  ? requestedRedirect
  : "/";

document
.getElementById("loginForm")
.addEventListener("submit",async(e)=>{

e.preventDefault();

const username=document.getElementById("username").value;
const password=document.getElementById("password").value;

const response=await fetch("/auth/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
credentials:"include",
body:JSON.stringify({username,password})
});

const data=await response.json();

if(response.ok){
window.location.href=redirect;
}
else{
document.getElementById("message").textContent=data.message;
}
});
</script>

</body>
</html>
